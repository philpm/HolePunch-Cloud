name: Cloud build artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: ''}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: ''}
          - {os: macos-15, target: aarch64-apple-darwin, ext: ''}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python vendor/holepunch/scripts/check-repository.py --root .
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: python3 scripts/build.py --release
      - shell: bash
        working-directory: vendor/holepunch
        run: ./scripts/prepare-sidecar.sh ${{ matrix.target }}
      - run: python3 scripts/package.py --target ${{ matrix.target }} --bin-dir target/release --rathole vendor/holepunch/apps/desktop/src-tauri/binaries/holepunch-rathole-${{ matrix.target }}${{ matrix.ext }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: holepunch-cloud-${{ matrix.target }}
          path: dist/*
