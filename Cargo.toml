[workspace]
members = ["apps/cloud"]
exclude = ["vendor/holepunch"]
resolver = "2"
[workspace.package]
version = "0.4.0-dev.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91.1"
repository = "https://github.com/philpm/HolePunch-Cloud"
[profile.release]
lto = true
codegen-units = 1
strip = true
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
